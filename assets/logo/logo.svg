<?xml version="1.0" encoding="UTF-8"?>
<svg width="420" height="120" viewBox="0 0 420 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b5cff"/>
      <stop offset="100%" stop-color="#0a1f44"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
  </defs>

  <!-- Icon -->
  <g transform="translate(10,20)">
    <!-- Diamond -->
    <polygon points="40,0 70,30 40,60 10,30" fill="#2ec4ff"/>
    <!-- Lightning -->
    <polygon points="95,5 75,40 92,40 72,75 115,30 95,30"
             fill="url(#goldGrad)"/>
    <!-- Chart arrow -->
    <polyline points="130,60 150,40 170,50 195,20"
              fill="none" stroke="#ef4444" stroke-width="6"/>
    <polygon points="195,20 188,35 205,30" fill="#ef4444"/>
  </g>

  <!-- Text -->
  <text x="220" y="55" font-size="34" font-weight="700"
        fill="url(#blueGrad)"
        font-family="Inter, Arial, sans-serif">
    TechWealth
  </text>
  <text x="220" y="90" font-size="28" font-weight="600"
        fill="#fb8500"
        font-family="Inter, Arial, sans-serif">
    Guide
  </text>
</svg>
