<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech Wealth Guide</title>

  <!-- Favicon (GitHub Pages safe) -->
  <link rel="icon" type="image/png" href="./assets/favicon.png" />

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #0b1220;
      color: #ffffff;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #1f2a44;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      height: 42px;
      width: auto;
    }

    .brand span {
      font-size: 20px;
      font-weight: 600;
    }

    .socials a {
      margin-left: 12px;
      text-decoration: none;
      color: #cbd5f5;
      font-size: 14px;
    }

    .socials a:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <!-- LOGO (fixed path) -->
      <img src="./assets/logo.svg" alt="Tech Wealth Guide Logo" />
      <span>Tech Wealth Guide</span>
    </div>

    <!-- SOCIAL LINKS (ONLY placeholders you control) -->
    <div class="socials">
      <a href="https://techwealthguide.github.io/" target="_blank">Website</a>
    </div>
  </header>

</body>
</html>
