<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TechWealth Guide – Making Tomorrow’s Millionaires Today</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <meta name="description" content="TechWealth Guide helps you master AI, Crypto, and Digital Wealth. Making tomorrow’s millionaires today.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./assets/favicon.png">

  <!-- Font Awesome (SOCIAL ICONS) -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #050b2c, #08124a);
      color: #ffffff;
      overflow-x: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      height: 40px;
      width: auto;
    }

    .logo span {
      font-size: 18px;
      font-weight: 700;
    }

    .hero {
      text-align: center;
      padding: 50px 20px;
      max-width: 900px;
      margin: auto;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .hero p {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .signup-box {
      background: rgba(255,255,255,0.08);
      padding: 25px;
      border-radius: 14px;
      max-width: 420px;
      margin: 0 auto;
    }

    .signup-box h2 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .signup-box input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      margin-bottom: 12px;
      font-size: 14px;
    }

    .signup-box button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #1e90ff;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .signup-box small {
      display: block;
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.7;
    }

    footer {
      margin-top: 60px;
      padding: 30px 20px;
      text-align: center;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 15px;
    }

    .social-links a {
      color: white;
      font-size: 20px;
      transition: opacity 0.2s ease;
    }

    .social-links a:hover {
      opacity: 0.7;
    }

    footer p {
      font-size: 12px;
      opacity: 0.6;
    }

    @media (max-width: 480px) {
      .hero h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <img src="./assets/logo.svg" alt="TechWealth Guide Logo">
    <span>TechWealth Guide</span>
  </div>
</header>

<section class="hero">
  <h1>Making Tomorrow’s Millionaires Today</h1>
  <p>Learn AI, Crypto, and Digital Wealth strategies built for the future.</p>

  <div class="signup-box">
    <h2>Sign up to unlock lessons</h2>
    <form>
      <input type="email" placeholder="Email address" required>
      <button type="submit">Create Free Account</button>
    </form>
    <small>Already have an account? Sign in coming soon.</small>
  </div>
</section>

<footer>
  <div class="social-links">
    <a href="https://www.facebook.com/Techwealthguide" target="_blank" rel="noopener noreferrer">
      <i class="fab fa-facebook-f"></i>
    </a>
    <a href="https://www.instagram.com/techwealth.official/" target="_blank" rel="noopener noreferrer">
      <i class="fab fa-instagram"></i>
    </a>
    <a href="https://www.tiktok.com/@techwealthguide" target="_blank" rel="noopener noreferrer">
      <i class="fab fa-tiktok"></i>
    </a>
  </div>
  <p>© 2025 TechWealth Guide. All rights reserved.</p>
</footer>

</body>
</html>
