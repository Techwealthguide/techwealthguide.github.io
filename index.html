<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TechWealthGuide</title>  <!-- Favicon -->  <link rel="icon" type="image/png" href="assets/favicon.png" />  <!-- Font -->  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">  <!-- Icons -->  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0b1c3d;
      color: #ffffff;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* HEADER */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand img {
      width: 40px;
      height: 40px;
    }

    .brand h1 {
      font-size: 1.4rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .signin-btn {
      border: 1px solid #ffffff;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    /* NAV */
    nav {
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    nav a {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    /* HERO */
    .hero {
      text-align: center;
      padding: 60px 20px 40px;
    }

    .hero h2 {
      font-size: 2rem;
      margin-bottom: 14px;
    }

    .hero p {
      font-size: 1rem;
      opacity: 0.85;
      max-width: 520px;
      margin: 0 auto;
    }

    /* NEWSLETTER */
    .newsletter {
      margin: 40px auto;
      background: #ffffff;
      color: #000000;
      max-width: 420px;
      padding: 26px;
      border-radius: 10px;
    }

    .newsletter h3 {
      margin-bottom: 12px;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .newsletter input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 0.95rem;
    }

    .newsletter button {
      width: 100%;
      margin-top: 14px;
      padding: 10px;
      background: #0b1c3d;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    /* SOCIALS */
    .socials {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin: 30px 0 40px;
      font-size: 1.4rem;
    }

    .socials a {
      opacity: 0.85;
    }

    /* MOBILE FIXES */
    @media (max-width: 600px) {
      .hero h2 {
        font-size: 1.6rem;
      }

      nav {
        gap: 12px;
      }
    }
  </style></head>
<body>  <header>
    <div class="brand">
      <img src="assets/logo.svg" alt="TechWealthGuide logo" />
      <h1>TechWealthGuide</h1>
    </div><a href="signin.html" class="signin-btn">Sign In</a>

<nav>
  <a href="#">AI</a>

  <a href="#">Investing</a>
  <a href="#">Startups</a>
</nav>

  </header>  <section class="hero">

  </section>  <section class="newsletter">
    <h3>Join the newsletter</h3>

    <button>Subscribe</button>
  </section>  <div class="socials">

  </html>
