<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TechWealth Guide – Making tomorrow’s millionaires today</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/assets/favicon.png">

  <!-- SEO -->
  <meta name="description" content="TechWealth Guide teaches AI, Crypto, Investing and Startups to help you build real wealth.">
  <meta name="robots" content="index, follow">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0a1a3a, #0f2a5c);
      color: #ffffff;
      text-align: center;
    }

    header {
      padding: 40px 20px 20px;
    }

    header img {
      width: 90px;
      margin-bottom: 15px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
    }

    header p {
      margin-top: 10px;
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .sections {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 20px;
      padding: 40px 20px;
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 25px 15px;
      text-decoration: none;
      color: #ffffff;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .card:hover {
      transform: translateY(-4px);
      background: rgba(255,255,255,0.1);
    }

    .card i {
      font-size: 28px;
      margin-bottom: 10px;
      color: #4da3ff;
    }

    .card span {
      display: block;
      margin-top: 8px;
      font-weight: 600;
    }

    .signup {
      background: #ffffff;
      color: #0a1a3a;
      padding: 35px 20px;
      border-radius: 20px;
      max-width: 420px;
      margin: 40px auto;
    }

    .signup h2 {
      margin-bottom: 10px;
      font-size: 1.5rem;
    }

    .signup p {
      font-size: 0.95rem;
      margin-bottom: 20px;
      color: #333;
    }

    .signup input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    .signup button {
      width: 100%;
      padding: 12px;
      background: #0a1a3a;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    footer {
      margin: 40px 0 20px;
    }

    .socials a {
      color: #ffffff;
      margin: 0 12px;
      font-size: 22px;
      text-decoration: none;
    }

    footer p {
      margin-top: 15px;
      font-size: 0.85rem;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<header>
  <img src="/assets/logo.svg" alt="TechWealth Guide Logo">
  <h1>TechWealth Guide</h1>
  <p>Making tomorrow’s millionaires today</p>
</header>

<section class="sections">
  <a href="/ai/" class="card">
    <i class="fa-solid fa-robot"></i>
    <span>AI</span>
  </a>
  <a href="/crypto/" class="card">
    <i class="fa-solid fa-bitcoin-sign"></i>
    <span>Crypto</span>
  </a>
  <a href="/investing/" class="card">
    <i class="fa-solid fa-chart-line"></i>
    <span>Investing</span>
  </a>
  <a href="/startup/" class="card">
    <i class="fa-solid fa-rocket"></i>
    <span>Startup</span>
  </a>
</section>

<section class="signup">
  <h2>Unlock Advanced Lessons</h2>
  <p>Create an account to access premium guides and downloads.</p>
  <form action="/success.html" method="post">
    <input type="email" placeholder="Email address" required>
    <button type="submit">Create Account</button>
  </form>
</section>

<footer>
  <div class="socials">
    <a href="https://facebook.com/Techwealthguide" target="_blank"><i class="fab fa-facebook"></i></a>
    <a href="https://instagram.com/techwealthguide" target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="https://tiktok.com/@techwealthguide" target="_blank"><i class="fab fa-tiktok"></i></a>
  </div>
  <p>© 2025 TechWealth Guide</p>
</footer>

</body>
</html>
