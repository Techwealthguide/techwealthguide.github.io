<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tools & Calculators — TechWealthGuide</title>
<meta name="description" content="Practical calculators and tools for AI, crypto, investing, and startups.">

<link rel="stylesheet" href="/assets/style.css">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230b1c2d'/%3E%3Cpath d='M28 60 L50 28 L72 60' stroke='%23ff8a3c' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3Cpath d='M28 72 L50 40 L72 72' stroke='%234db1ff' stroke-width='6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
</head>

<body>

<header>
  <div class="nav">
    <div class="logo">
      <svg viewBox="0 0 100 100">
        <rect width="100" height="100" rx="22" fill="#11283f"/>
        <path d="M28 60 L50 28 L72 60" stroke="#ff8a3c" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M28 72 L50 40 L72 72" stroke="#4db1ff" stroke-width="6" fill="none" stroke-linecap="round"/>
      </svg>
      <span>TechWealthGuide</span>
    </div>
  </div>
</header>

<div class="container">

<h1>Tools & Calculators</h1>
<p>Simple tools to support better decisions — not financial advice.</p>

<!-- === STARTUP COST ESTIMATOR === -->
<div class="card">
  <h2>Startup Cost Estimator</h2>
  <label>Monthly tools & software ($)</label>
  <input type="number" id="tools" placeholder="e.g. 50">

  <label>Marketing budget ($)</label>
  <input type="number" id="marketing" placeholder="e.g. 100">

  <label>Hosting & infrastructure ($)</label>
  <input type="number" id="hosting" placeholder="e.g. 20">

  <button class="btn primary" onclick="calcStartup()">Estimate Cost</button>

  <p id="startupResult" class="result"></p>
</div>

<!-- === INVESTMENT GROWTH CALCULATOR === -->
<div class="card">
  <h2>Investment Growth Calculator</h2>
  <label>Initial investment ($)</label>
  <input type="number" id="principal" placeholder="e.g. 1000">

  <label>Annual return (%)</label>
  <input type="number" id="rate" placeholder="e.g. 10">

  <label>Years</label>
  <input type="number" id="years" placeholder="e.g. 5">

  <button class="btn primary" onclick="calcGrowth()">Calculate Growth</button>

  <p id="growthResult" class="result"></p>
</div>

<!-- === CRYPTO RISK CHECK === -->
<div class="card">
  <h2>Crypto Risk Check</h2>
  <label>Portfolio value ($)</label>
  <input type="number" id="portfolio" placeholder="e.g. 2000">

  <label>Single trade size ($)</label>
  <input type="number" id="trade">

  <button class="btn primary" onclick="calcRisk()">Check Risk</button>

  <p id="riskResult" class="result"></p>
</div>

<div class="section">
  <a class="btn ghost" href="/index.html">Back to Home</a>
</div>

</div>

<footer>
  <p>
    <a href="/legal/about.html">About</a> ·
    <a href="/legal/privacy.html">Privacy</a> ·
    <a href="/legal/terms.html">Terms</a>
  </p>
  <p>© TechWealthGuide</p>
</footer>

<script>
function calcStartup() {
  const t = +tools.value || 0;
  const m = +marketing.value || 0;
  const h = +hosting.value || 0;
  startupResult.textContent =
    `Estimated monthly cost: $${t + m + h}`;
}

function calcGrowth() {
  const p = +principal.value;
  const r = (+rate.value / 100);
  const y = +years.value;

  const total = p * Math.pow(1 + r, y);
  growthResult.textContent =
    `Estimated value after ${y} years: $${total.toFixed(2)}`;
}

function calcRisk() {
  const p = +portfolio.value;
  const t = +trade.value;

  const risk = (t / p) * 100;
  riskResult.textContent =
    risk > 5
      ? `High risk: ${risk.toFixed(1)}% of portfolio`
      : `Risk OK: ${risk.toFixed(1)}% of portfolio`;
}
</script>

</body>
</html>
